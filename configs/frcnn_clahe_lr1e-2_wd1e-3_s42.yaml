# Grid taxa x decaimento de pesos (D46).
# Igual a frcnn_clahe.yaml exceto optim.lr, optim.weight_decay e train.seed.
name: frcnn_clahe_lr1e-2_wd1e-3_s42
enhancement: clahe
enhancement_params:
  clip_limit: 2.0   # fixado antes do treino (D35)
  tile_grid: 8      # grade de 8 x 8 tiles

model:
  arch: faster_rcnn
  pretrained_backbone: true
  trainable_backbone_layers: 3
  nms_threshold: 0.3
  score_threshold: 0.0
  detections_per_image: 100

optim:
  lr: 1.0e-2          # 5e-3 (baseline, testado com batch 6) x 12/6, escala linear
  momentum: 0.9
  weight_decay: 1.0e-3   # sob teste (D46); o adotado é 5.0e-4
  lr_step_epochs: 10  # fixado (DESENVOLVIMENTO 4.5)
  lr_gamma: 0.1

train:
  max_epochs: 30
  batch_size: 12   # pico de 4,7 GB com 6 numa T4 (piloto); 12 deixa folga
  num_workers: 2
  amp: true
  early_stopping_patience: 5  # fixado (DESENVOLVIMENTO 4.6)
  seed: 42

augmentation:
  hflip_p: 0.5
  brightness_contrast_p: 0.5  # fixado (DESENVOLVIMENTO 4.7)
  brightness: 0.1
  contrast: 0.1
  noise_p: 0.3
  noise_std: 0.01
