# Comparação de arquiteturas com sorteio balanceado (D38): RetinaNet.
# Igual a retinanet_none.yaml exceto train.balanced_sampling.
name: retinanet_balanced
enhancement: none

model:
  arch: retinanet
  pretrained_backbone: true
  trainable_backbone_layers: 3
  nms_threshold: 0.3
  score_threshold: 0.0
  detections_per_image: 100

optim:
  # Mesma proporção das referências do torchvision (references/detection):
  # RetinaNet 0,01 / Faster R-CNN 0,02 = 0,5  ->  0,5 x 1e-2
  lr: 5.0e-3
  momentum: 0.9
  weight_decay: 5.0e-4
  lr_step_epochs: 10
  lr_gamma: 0.1

train:
  max_epochs: 30
  batch_size: 12   # pico de 4,7 GB com 6 numa T4 (piloto); 12 deixa folga
  num_workers: 2
  amp: true
  early_stopping_patience: 5
  seed: 42
  balanced_sampling: true

augmentation:
  hflip_p: 0.5
  brightness_contrast_p: 0.5
  brightness: 0.1
  contrast: 0.1
  noise_p: 0.3
  noise_std: 0.01
