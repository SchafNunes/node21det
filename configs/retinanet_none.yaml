# Etapa 1: arquitetura de comparação, sem realce.
# Igual a frcnn_none.yaml exceto arquitetura e taxa de aprendizado.
name: retinanet_none
enhancement: none

model:
  arch: retinanet
  pretrained_backbone: true
  trainable_backbone_layers: 3
  nms_threshold: 0.3
  score_threshold: 0.0
  detections_per_image: 100

optim:
  # Mesma proporção das referências do torchvision (references/detection):
  # RetinaNet 0,01 / Faster R-CNN 0,02 = 0,5  ->  0,5 x 5e-3
  lr: 2.5e-3
  momentum: 0.9
  weight_decay: 5.0e-4
  lr_step_epochs: 10
  lr_gamma: 0.1

train:
  max_epochs: 30
  batch_size: 6
  num_workers: 2
  amp: true
  early_stopping_patience: 5
  seed: 42

augmentation:
  hflip_p: 0.5
  brightness_contrast_p: 0.5
  brightness: 0.1
  contrast: 0.1
  noise_p: 0.3
  noise_std: 0.01
